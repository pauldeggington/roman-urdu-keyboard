name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1 && rc=0 || rc=$?
          tail -n 30 build.log
          if [ "$rc" -ne 0 ]; then
            { grep -E -A8 '^e: |What went wrong|Could not|error:' build.log | head -80 || true; } > errs.txt
            msg=$(sed 's/%/%25/g' errs.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
            exit "$rc"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: roman-urdu-keyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
