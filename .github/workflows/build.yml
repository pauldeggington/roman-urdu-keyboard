name: Build APK

on:
  push:
    branches: [main, rewrite]
  workflow_dispatch:

permissions:
  contents: write   # lets the main-branch build publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # optional: a GIPHY API key built into the release so GIFs and stickers work without pasting one
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        # <major.minor from the VERSION file>.<CI build>, e.g. 2.1.121. versionCode is 4300 + build, so every build installs over the last.
        run: |
          echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((4300 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pinned.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/pinned.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the pinned signing key."
          else
            echo "No signing secrets set; using a random debug key."
          fi

      - name: Test the glide decoder
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon --stacktrace > test.log 2>&1 && rc=0 || rc=$?
          grep -E "careful glides|sloppy glides" test.log || true
          grep -E "CONTRAST" test.log | sed 's/; /\n/g' | cut -c1-120 | paste -sd'|' | fold -w 900 | while read -r l; do echo "::notice title=Contrast::$l"; done
          grep -E "SCREENSHOTFAIL|SNAPSHOT|ACCESSIBILITY" test.log | cut -c1-500 | while read -r l; do echo "::notice title=Screenshot::$l"; done
          grep -E "AUTOCORRECT" test.log | cut -c1-900 | while read -r l; do echo "::notice title=Autocorrect::$l"; done
          if [ "$rc" -ne 0 ]; then
            { grep -E -A6 '^e: |FAILED|AssertionError|What went wrong|Could not|error:' test.log | head -60 || true; } > terrs.txt
            msg=$(sed 's/%/%25/g' terrs.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Glide tests failed::${msg}"
            exit "$rc"
          fi

      - name: Keep the screenshots the tests drew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore

      - name: Publish the drawn screens to the ci-ui-shots branch (to look at without opening Actions)
        if: always() && github.ref != 'refs/heads/main'
        continue-on-error: true
        run: |
          ls app/build/screenshots/*.png > /dev/null 2>&1 || exit 0
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          # a commit holding only the pictures, built beside the checkout so the build files are untouched
          export GIT_INDEX_FILE=/tmp/ui-shots.index
          rm -f "$GIT_INDEX_FILE"
          git --work-tree=app/build/screenshots add -A .
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "Drawn screens for ${GITHUB_SHA}")
          git push -f origin "$COMMIT:refs/heads/ci-ui-shots"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 && rc=0 || rc=$?
          tail -n 40 build.log
          if [ "$rc" -ne 0 ]; then
            { grep -E -A8 '^e: |What went wrong|Could not|error:|ERROR:' build.log | head -90 || true; } > errs.txt
            msg=$(sed 's/%/%25/g' errs.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
            exit "$rc"
          fi
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/roman-urdu-keyboard.apk

      - name: Build the R8 (shrunk) copy; it becomes the main APK if it builds, the normal one stays as a fallback
        continue-on-error: true
        run: |
          ./gradlew :app:assembleDebug -Pminify --no-daemon > r8.log 2>&1 && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            cp app/build/outputs/apk/debug/*-r8.apk out/roman-urdu-keyboard-r8.apk
            mv out/roman-urdu-keyboard.apk out/roman-urdu-keyboard-standard.apk
            cp out/roman-urdu-keyboard-r8.apk out/roman-urdu-keyboard.apk
            echo "::notice title=R8 build::$(du -h out/roman-urdu-keyboard.apk | cut -f1) shipped, $(du -h out/roman-urdu-keyboard-standard.apk | cut -f1) standard kept as fallback"
          else
            { grep -E -A4 '^e: |What went wrong|ERROR|Missing class' r8.log | head -20 || true; } > r8err.txt
            echo "::warning title=R8 build failed, shipping the standard APK::$(tr '\n' ' ' < r8err.txt | cut -c1-300)"
          fi

      - name: Show signing fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          FP=$("$APKSIGNER" verify --print-certs out/roman-urdu-keyboard.apk | grep -i "SHA-256 digest" | head -n 1 || true)
          echo "::notice title=Signing fingerprint::$FP"

      - name: Inspect APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=out/roman-urdu-keyboard.apk
          SIZE=$(du -h "$APK" | cut -f1)
          PKG=$("$AAPT2" dump badging "$APK" | grep -E "^package:|^launchable-activity:|^sdkVersion" | tr '\n' ' ' | cut -c1-300)
          LIBS=$(unzip -l "$APK" | grep -o 'lib/[^ ]*\.so' | sed 's#.*/##' | sort | tr '\n' ' ' | cut -c1-400)
          echo "::notice title=APK::size $SIZE | $PKG"
          echo "::notice title=Native libs::$LIBS"

      - uses: actions/upload-artifact@v4
        with:
          name: roman-urdu-keyboard-debug
          path: out/roman-urdu-keyboard.apk

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          cp out/roman-urdu-keyboard.apk "out/RomanUrduKeyboard-${VERSION_NAME}.apk"
          {
            echo "## Install"
            echo ""
            echo "1. On your Android phone, download **RomanUrduKeyboard-${VERSION_NAME}.apk** below."
            echo "2. Open it. If Android asks, allow installs from your browser or Files app, then tap **Install**."
            echo "3. Open **Roman Urdu Keyboard** and follow the setup guide. It downloads the translator (about 2.6 GB, once) and walks you through turning the keyboard on."
            echo ""
            echo "Already installed? This version installs over it and keeps your settings and the translator."
            echo ""
            echo "Needs Android 12 or newer on a 64-bit phone with about 3 GB free. Works offline after setup."
            echo ""
            echo "## Changes"
            echo ""
            git log -1 --pretty=format:'%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D'
          } > notes.md
          ASSETS="out/RomanUrduKeyboard-${VERSION_NAME}.apk"
          if [ -f out/roman-urdu-keyboard-standard.apk ]; then
            cp out/roman-urdu-keyboard-standard.apk "out/RomanUrduKeyboard-${VERSION_NAME}-standard.apk"
            ASSETS="$ASSETS out/RomanUrduKeyboard-${VERSION_NAME}-standard.apk"
            echo "" >> notes.md
            echo "**If something misbehaves:** the main APK is shrunk with R8 (about a third of the size). \`RomanUrduKeyboard-${VERSION_NAME}-standard.apk\` is the same app without shrinking; install it over the top." >> notes.md
          fi
          gh release create "$TAG" $ASSETS \
            --title "Roman Urdu Keyboard $(tr -d '[:space:]' < VERSION) (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
          echo "::notice title=Released::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

