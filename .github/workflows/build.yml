name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            msg=$(grep -E -A6 "^e: |What went wrong|error:" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", substr($0,1,300)}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: roman-urdu-keyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
