name: Build APK

on:
  push:
    branches: [main, rewrite]
  workflow_dispatch:

permissions:
  contents: write   # lets the main-branch build publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 1.0.<run> for people; the Version step sets versionCode 4300+<run> so each release installs over the last
      VERSION_NAME: 2.0.${{ github.run_number }}
      # optional: a GIPHY API key built into the release so GIFs and stickers work without pasting one
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION_CODE=$((4300 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pinned.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/pinned.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the pinned signing key."
          else
            echo "No signing secrets set; using a random debug key."
          fi

      - name: Test the glide decoder
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace > test.log 2>&1 && rc=0 || rc=$?
          grep -E "careful glides|sloppy glides" test.log || true
          grep -E "AUTOCORRECT" test.log | cut -c1-900 | while read -r l; do echo "::notice title=Autocorrect::$l"; done
          if [ "$rc" -ne 0 ]; then
            { grep -E -A6 '^e: |FAILED|AssertionError|What went wrong|Could not|error:' test.log | head -60 || true; } > terrs.txt
            msg=$(sed 's/%/%25/g' terrs.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Glide tests failed::${msg}"
            exit "$rc"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 && rc=0 || rc=$?
          tail -n 40 build.log
          if [ "$rc" -ne 0 ]; then
            { grep -E -A8 '^e: |What went wrong|Could not|error:|ERROR:' build.log | head -90 || true; } > errs.txt
            msg=$(sed 's/%/%25/g' errs.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
            exit "$rc"
          fi
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/roman-urdu-keyboard.apk

      - name: Build experimental R8 copy (rewrite branch only; never blocks the build)
        if: github.ref == 'refs/heads/rewrite'
        continue-on-error: true
        run: |
          ./gradlew :app:assembleDebug -PtrialR8 --no-daemon > r8.log 2>&1 && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            cp app/build/outputs/apk/debug/*-r8.apk out/roman-urdu-keyboard-r8.apk
            echo "::notice title=R8 copy::$(du -h out/roman-urdu-keyboard-r8.apk | cut -f1) vs $(du -h out/roman-urdu-keyboard.apk | cut -f1) normal"
          else
            { grep -E -A4 '^e: |What went wrong|ERROR|Missing class' r8.log | head -20 || true; } > r8err.txt
            echo "::warning title=R8 copy failed::$(tr '\n' ' ' < r8err.txt | cut -c1-300)"
          fi

      - name: Show signing fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          FP=$("$APKSIGNER" verify --print-certs out/roman-urdu-keyboard.apk | grep -i "SHA-256 digest" | head -n 1 || true)
          echo "::notice title=Signing fingerprint::$FP"

      - name: Inspect APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=out/roman-urdu-keyboard.apk
          SIZE=$(du -h "$APK" | cut -f1)
          PKG=$("$AAPT2" dump badging "$APK" | grep -E "^package:|^launchable-activity:|^sdkVersion" | tr '\n' ' ' | cut -c1-300)
          LIBS=$(unzip -l "$APK" | grep -o 'lib/[^ ]*\.so' | sed 's#.*/##' | sort | tr '\n' ' ' | cut -c1-400)
          echo "::notice title=APK::size $SIZE | $PKG"
          echo "::notice title=Native libs::$LIBS"

      - uses: actions/upload-artifact@v4
        with:
          name: roman-urdu-keyboard-debug
          path: out/roman-urdu-keyboard.apk

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          cp out/roman-urdu-keyboard.apk "out/RomanUrduKeyboard-${VERSION_NAME}.apk"
          {
            echo "## Install"
            echo ""
            echo "1. On your Android phone, download **roman-urdu-keyboard.apk** below."
            echo "2. Open it. If Android asks, allow installs from your browser or Files app, then tap **Install**."
            echo "3. Open **Roman Urdu Keyboard** and follow the setup guide. It downloads the translator (about 2.6 GB, once) and walks you through turning the keyboard on."
            echo ""
            echo "Already installed? This version installs over it and keeps your settings and the translator."
            echo ""
            echo "Needs Android 12 or newer on a 64-bit phone with about 3 GB free. Works offline after setup."
            echo ""
            echo "## Changes"
            echo ""
            git log -1 --pretty=format:'%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D'
          } > notes.md
          gh release create "$TAG" \
            "out/roman-urdu-keyboard.apk" \
            "out/RomanUrduKeyboard-${VERSION_NAME}.apk" \
            --title "Roman Urdu Keyboard ${VERSION_NAME}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
          echo "::notice title=Released::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Publish test release (rewrite branch, not the main download)
        if: github.ref == 'refs/heads/rewrite' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}-test"
          cp out/roman-urdu-keyboard.apk "out/RomanUrduKeyboard-${VERSION_NAME}-test.apk"
          {
            echo "**Test version of the rewritten keyboard.** It is not the main download and the in-app Update button ignores it."
            echo ""
            echo "Install it like any APK. It installs over the current app and keeps your settings. If Android's install screen warns about it, choose More details, then Install anyway."
            echo ""
            git log -1 --pretty=format:'%s'
          } > notes.md
          EXTRA=""
          if [ -f out/roman-urdu-keyboard-r8.apk ]; then
            cp out/roman-urdu-keyboard-r8.apk "out/RomanUrduKeyboard-${VERSION_NAME}-test-R8-experiment.apk"
            EXTRA="out/RomanUrduKeyboard-${VERSION_NAME}-test-R8-experiment.apk"
            echo "" >> notes.md
            echo "Also attached: an experimental R8 copy (smaller, may start faster). Only use it to compare. If translation misbehaves in it, go back to the normal APK." >> notes.md
          fi
          gh release create "$TAG" "out/RomanUrduKeyboard-${VERSION_NAME}-test.apk" $EXTRA \
            --title "Test ${VERSION_NAME} (rewritten keyboard)" --notes-file notes.md \
            --target "$GITHUB_SHA" --prerelease
          echo "::notice title=Test release::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
